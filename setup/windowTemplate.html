<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body,
        html {
            width: 0px;
            height: 0px;
            margin: 0px;
            padding: 0px;
            pointer-events: none;
        }

        #window {
            background: #fff;
            border: 2px solid #555;
            border-width: 4px;
            border-style: solid;
            border-color: #ddd #000 #000 #ddd;
            position: absolute;
            min-width: 400px;
            max-width: 90vw;
            min-height: 300px;
            max-height: 90vh;
            width: 400px;
            height: 300px;
            box-sizing: border-box;
            resize: both;
            overflow: auto;
            min-width: max(300px, min-content);
            pointer-events: stroke;
        }

        #window-header {
            background: linear-gradient(90deg, #0000aa 0%, #56aac0 100%);
            padding: 12px 16px;
            border-bottom: 1px solid #555;
            opacity: 0.9;
            backdrop-filter: blur(4px);
            margin: 1px;
            cursor: move;
        }

        #window-header h2 {
            margin: 0;
            font-size: 16px;
            color: #fff;
            display: inline-block;
        }

        #window-header button {
            float: right;
            background: #dd2a2a;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            font-weight: bolder;
            opacity: 0.9;
        }

        #window-content {
            padding: 0px;
            height: calc(100% - 50px);
            box-sizing: border-box;
        }

        #window iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div id="window">
        <div id="window-header">
            <img height="18" width="18">
            <h2>Loading...</h2>
            <button>X</button>
        </div>
        <div id="window-content">
            <iframe frameborder="0"></iframe>
        </div>
    </div>
    <script defer>
        let searchParams = new URLSearchParams(window.location.search);
        let windowName = searchParams.get('windowName');
        let windowPath = searchParams.get('windowPath');
        let iconPath = searchParams.get('iconPath') || '/icons/defaultWindow.png';
        let minWidth = searchParams.get('minWidth') || 400;
        let minHeight = searchParams.get('minHeight') || 300;
        let passThrough = '?';

        searchParams.forEach((value, key) => {
            if (key !== 'windowName' && key !== 'windowPath' && key !== 'iconPath' && key !== 'minWidth' && key !== 'minHeight') {
                passThrough += `${key}=${encodeURIComponent(value)}&`;
            }
        });


        const iframe = document.querySelector('iframe');
        iframe.src = windowPath + passThrough;

        // window name
        iframe.onload = function () {
            let header = document.querySelector("#window-header > h2");
            if (typeof windowName != 'string') {
                windowName = (() => { try { return iframe.contentWindow.document.title } catch { return 'Window' } })();
            }
            if (windowName == null || windowName.trim() === '') {
                header.textContent = 'Window';
            } else {
                header.textContent = windowName;
            }
        }

        // icon
        const icon = document.querySelector('img');
        try {
            icon.src = iconPath;
        } catch (e) {
            console.warn('Error setting icon, defaulting to /icons/defaultWindow.png');
            icon.src = '/icons/defaultWindow.png';
            console.warn(e);
        }

        // Set minimum size
        const windowElement = document.getElementById('window');
        windowElement.style.minWidth = minWidth + 'px';
        windowElement.style.minHeight = minHeight + 'px';
        windowElement.style.width = minWidth + 'px';
        windowElement.style.height = minHeight + 'px';

        // Draggable logic
        const header = document.getElementById('window-header');
        let offsetX = 0, offsetY = 0, isDragging = false;

        // Mouse down event to start dragging
        header.addEventListener('mousedown', function (e) {
            isDragging = true;
            offsetX = e.clientX - windowElement.offsetLeft;
            offsetY = e.clientY - windowElement.offsetTop;
        });

        // Mouse move event to drag the window
        document.addEventListener('mousemove', function (e) {
            if (isDragging) {
                // Update the window's position based on the mouse movement
                windowElement.style.left = (e.clientX - offsetX) + 'px';
                windowElement.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        // Mouse up event to stop dragging
        document.addEventListener('mouseup', function () {
            isDragging = false;
        });

        // Remove the dragWindow('firstFrame') call
        // It is unnecessary and causes the window to jump to the top-left corner
    </script>
</body>

</html>
