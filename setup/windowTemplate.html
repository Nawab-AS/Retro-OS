<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            margin: 0px;
            padding: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #window {
            background: #fff;
            border: 2px solid #555;
            border-width: 4px;
            border-style: solid;
            border-color: #ddd #000 #000 #ddd;
            box-sizing: border-box;
            overflow: auto;
        }

        #window-header {
            background: linear-gradient(90deg, #0000aa 0%, #56aac0 100%);
            padding: 12px 16px;
            border-bottom: 1px solid #555;
            margin: 1px;
            user-select: none;
        }

        #window-header h2 {
            margin: 0;
            font-size: 16px;
            color: #fff;
            display: inline-block;
        }

        #window-header button {
            float: right;
            background: #dd2a2a;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            font-weight: bolder;
            opacity: 0.9;
        }

        #window-content {
            padding: 0px;
            height: calc(100% - 50px);
            box-sizing: border-box;
        }

        #window iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div id="window">
        <div id="window-header">
            <img height="18" width="18">
            <h2>Loading...</h2>
            <button>X</button>
        </div>
        <div id="window-content">
            <iframe frameborder="0"></iframe>
        </div>
    </div>
    <script defer>
        let searchParams = new URLSearchParams(window.location.search);
        let windowName = searchParams.get('windowName');
        let windowPath = searchParams.get('windowPath');
        let iconPath = "../" + (searchParams.get('iconPath') || 'icons/defaultWindow.png');
        let width = searchParams.get('width') || 400;
        let height = searchParams.get('height') || 300;
        let passThrough = '?';

        searchParams.forEach((value, key) => {
            if (key !== 'windowName' && key !== 'windowPath' && key !== 'iconPath' && key !== 'width' && key !== 'height') {
                passThrough += `${key}=${encodeURIComponent(value)}&`;
            }
        });


        const iframe = document.querySelector('iframe');
        iframe.src = windowPath + passThrough;

        // window name
        iframe.onload = function () {
            let header = document.querySelector("#window-header > h2");
            if (typeof windowName != 'string') {
                windowName = (() => { try { return iframe.contentWindow.document.title } catch { return 'Window' } })();
            }
            if (windowName == null || windowName.trim() === '') {
                header.textContent = 'Window';
            } else {
                header.textContent = windowName;
            }
        }

        // icon
        const icon = document.querySelector('img');
        try {
            icon.src = iconPath;
        } catch (e) {
            console.warn('Error setting icon, defaulting to ../icons/defaultWindow.png');
            icon.src = '../icons/defaultWindow.png';
            console.warn(e);
        }

        // Set size
        const windowElement = document.getElementById('window');
        windowElement.style.width = width + 'px';
        windowElement.style.height = height + 'px';

        // Close button functionality
        const closeButton = document.querySelector('#window-header button');
        closeButton.addEventListener('click', function() {
            // Send message to parent to close this window
            window.parent.postMessage({ type: 'closeWindow', windowId: window.frameElement.id }, '*');
        });
    </script>
</body>

</html>
