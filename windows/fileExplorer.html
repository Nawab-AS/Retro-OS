<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Explorer</title>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            background: #00bcd4; /* cyan */
            color: #000; 
            margin: 0;
            padding: 10px;
            background-image: 
                linear-gradient(45deg, #00bcd4 25%, transparent 25%), 
                linear-gradient(-45deg, #00bcd4 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #0097a7 75%), 
                linear-gradient(-45deg, transparent 75%, #0097a7 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        h1 {
            background: #e0ffff;
            color: #008b8b;
            padding: 8px;
            margin: 0 0 10px 0;
            border: 2px outset #b2ebf2;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            box-shadow: 0 2px 8px #0097a744;
        }
        
        #explorer { 
            background: #e0ffff;
            border: 2px inset #b2ebf2;
            padding: 12px;
            color: #004d4d;
            max-height: 420px;
            overflow-y: auto;
            box-shadow: 0 2px 12px #0097a744;
        }
        
        ul { 
            list-style: none; 
            padding-left: 20px; 
            margin: 0;
        }
        
        li { 
            cursor: pointer; 
            padding: 2px 4px;
            user-select: none;
            border: 1px solid transparent;
        }
        
        li:hover {
            background: #00bcd4;
            color: #0047d4;
            border: 1px dotted #008b8b;
        }
        
        li.selected {
            background: #008b8b;
            color: white;
            border: 1px solid white;
        }
        
        .directory {
            font-weight: bold;
            color: #006064;
        }
        
        .nested {
            background: #b2ebf2;
            border-left: 2px solid #00bcd4;
            margin-left: 10px;
        }
        
        .loading {
            font-style: italic;
            color: #008b8b;
        }
        
        .error {
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>File Explorer</h1>
    <div id="explorer">Loading...</div>
    <script>
        // Load fileSystem.xml and parse it
        let currentExplorerPath = '/Retro';
        
        function loadFileSystem(targetPath = '/Retro') {
            currentExplorerPath = targetPath;
            const explorer = document.getElementById('explorer');
            explorer.innerHTML = '<div class="loading">Loading file system...</div>';
            
            // Update the header to show current path
            const header = document.querySelector('h1');
            header.textContent = `File Explorer - ${targetPath}`;
            
            fetch('/fileSystem.xml')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(str => (new window.DOMParser()).parseFromString(str, "text/xml"))
                .then(xml => {
                    // Check for XML parsing errors
                    const parserError = xml.querySelector('parsererror');
                    if (parserError) {
                        throw new Error('XML parsing error');
                    }
                    
                    const root = xml.documentElement;
                    explorer.innerHTML = '';
                    
                    if (targetPath === '/Retro') {
                        // Show root directory
                        explorer.appendChild(renderNode(root, true));
                    } else {
                        // Navigate to specific folder
                        const pathParts = targetPath.split('/').filter(part => part);
                        let currentNode = root;
                        
                        // Find the target directory
                        for (let i = 1; i < pathParts.length; i++) {
                            const folderName = pathParts[i];
                            const foundDir = Array.from(currentNode.children)
                                .find(child => child.tagName === 'directory' && child.getAttribute('name') === folderName);
                            if (foundDir) {
                                currentNode = foundDir;
                            }
                        }
                        
                        // Show the contents of the target directory
                        const targetFolderName = pathParts[pathParts.length - 1];
                        explorer.innerHTML = `<h2 style="color: #006064; margin-bottom: 10px;">Contents of ${targetFolderName}:</h2>`;
                        explorer.appendChild(renderNode(currentNode, false));
                    }
                })
                .catch(error => {
                    console.error('Error loading file system:', error);
                    explorer.innerHTML = '<div class="error">Error loading file system: ' + error.message + '</div>';
                });
        }

        function renderNode(node, isRoot = false) {
            const ul = document.createElement('ul');
            
            // If this is the root, add its name as a header
            if (isRoot && node.getAttribute('name')) {
                const rootLi = document.createElement('li');
                rootLi.textContent = node.getAttribute('name');
                rootLi.className = 'directory expanded';
                const rootUl = document.createElement('ul');
                rootUl.className = 'nested';
                
                Array.from(node.children).forEach(child => {
                    rootUl.appendChild(createNodeElement(child));
                });
                
                rootLi.appendChild(rootUl);
                ul.appendChild(rootLi);
                return ul;
            }
            
            Array.from(node.children).forEach(child => {
                ul.appendChild(createNodeElement(child));
            });
            return ul;
        }
        
        function createNodeElement(child) {
            const li = document.createElement('li');
            const name = child.getAttribute('name');
            li.textContent = name;
            
            if (child.tagName === 'directory') {
                li.className = 'directory';
                li.onclick = function(e) {
                    e.stopPropagation();
                    toggleDirectory(li, child);
                };
            } else {
                // Determine file type based on tag name or extension
                if (child.tagName === 'image') {
                    li.className = 'image';
                } else if (child.tagName === 'file') {
                    // Check if it's an executable (no extension typically means executable in this context)
                    if (!name.includes('.')) {
                        li.className = 'executable';
                    } else {
                        li.className = 'file';
                    }
                } else {
                    li.className = 'file';
                }
                
                // Add click to "open" files
                li.onclick = function(e) {
                    e.stopPropagation();
                    // Highlight the clicked file
                    const allFiles = document.querySelectorAll('li');
                    allFiles.forEach(f => f.classList.remove('selected'));
                    li.classList.add('selected');
                    // Open the file
                    openFile(name, li.className, currentExplorerPath);
                };
            }
            
            return li;
        }
        
        function toggleDirectory(li, node) {
            const existingNested = li.querySelector('.nested');
            
            if (existingNested) {
                // Directory is expanded, collapse it
                li.removeChild(existingNested);
                li.classList.remove('expanded');
            } else {
                // Directory is collapsed, expand it
                if (node.children.length > 0) {
                    const nestedUl = document.createElement('ul');
                    nestedUl.className = 'nested';
                    
                    Array.from(node.children).forEach(child => {
                        nestedUl.appendChild(createNodeElement(child));
                    });
                    
                    li.appendChild(nestedUl);
                    li.classList.add('expanded');
                } else {
                    // Empty directory
                    const nestedUl = document.createElement('ul');
                    nestedUl.className = 'nested';
                    const emptyLi = document.createElement('li');
                    emptyLi.textContent = '(empty)';
                    emptyLi.style.fontStyle = 'italic';
                    emptyLi.style.color = '#808080';
                    nestedUl.appendChild(emptyLi);
                    li.appendChild(nestedUl);
                    li.classList.add('expanded');
                }
            }
        }
        
        function openFile(fileName, fileType, currentPath) {
            console.log('Opening file:', fileName, 'Type:', fileType, 'Path:', currentPath);
            
            // Get the full file path
            const filePath = currentPath ? `${currentPath}/${fileName}` : `/Retro/${fileName}`;
            
            // Send message to parent window (the main application)
            // The message needs to go through the window template to the main window
            const message = { 
                type: 'openFile', 
                filePath: filePath,
                fileName: fileName 
            };
            
            // In the window template structure, window.parent is the window template
            // and window.parent.parent is the main window
            try {
                window.parent.parent.postMessage(message, '*');
                console.log('Message sent to main window:', message);
            } catch (e) {
                console.error('Failed to send message:', e);
            }
        }
        
        // Load the file system when the page loads
        window.addEventListener('load', () => {
            // Get initial path from URL parameters if any
            const urlParams = new URLSearchParams(window.location.search);
            const initialPath = urlParams.get('path') || '/Retro';
            loadFileSystem(initialPath);
        });

        // Listen for messages from parent window
        window.addEventListener('message', (event) => {
            if (event.data.type === 'setPath') {
                loadFileSystem(event.data.path);
            }
        });
    </script>
</body>
</html>
